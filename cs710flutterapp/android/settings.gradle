pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
}

include ":app"

// Include the csl-rfid-android-sdk module from parent project
include ":csl-rfid-android-sdk"
project(":csl-rfid-android-sdk").projectDir = new File(settingsDir, "../../csl-rfid-android-sdk")

// Include the cslibrary4a module (core SDK) - transitive dependency
include ":cslibrary4a"
project(":cslibrary4a").projectDir = new File(settingsDir, "../../cslibrary4a")

// Include the epctagcoder module - transitive dependency
include ":epctagcoder"
project(":epctagcoder").projectDir = new File(settingsDir, "../../epctagcoder")
